<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: let the page extend under the notch / Dynamic Island / home indicator,
      which makes env(safe-area-inset-*) report real values instead of 0.
      Zoom is intentionally NOT disabled: pinch-zoom is visible in visualViewport.scale.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Home Screen web app (iOS + others) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent = content draws under the status bar (only way to get full screen height). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Screen Height" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Layer test: html background = red, theme-color = darkred (normally both are the same colour), .content = darkgrey.
         inner.html has the same theme-color. -->
    <meta name="theme-color" content="darkred" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Screen Height POC</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main-page.ts"></script>
  </body>
</html>
