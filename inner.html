<!doctype html>
<!-- Same <head> as index.html (both are installable Home Screen apps). Differences: title, apple-mobile-web-app-title, entry script. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: let the page extend under the notch / Dynamic Island / home indicator,
      which makes env(safe-area-inset-*) report real values instead of 0.
      Zoom is intentionally NOT disabled: pinch-zoom is visible in visualViewport.scale.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Home Screen web app (iOS + others) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default: tested on the device; in an installed iOS 27 web app the page is drawn under the status bar anyway. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Screen Height inner" />
    <meta name="format-detection" content="telephone=no" />
    <!-- theme-color = the page background (white), as recommended. It was darkred during the layer-colour test. Same in index.html. -->
    <meta name="theme-color" content="white" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Screen Height POC (inner scroll)</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main-inner.ts"></script>
  </body>
</html>
